[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "disk-monitor"
version = "0.1.0"
description = "Passive Linux HDD telemetry"
requires-python = ">=3.11"

[project.scripts]
disk-monitor = "disk_monitor.cli:main"

[tool.setuptools]
packages = ["disk_monitor"]

[tool.ruff]
required-version = "==0.16.10"
line-length = 88
target-version = "py311"
extend-include = ["disk-monitor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"disk-monitor" = ["E402"]
